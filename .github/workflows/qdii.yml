name: QDII quota monitor
on:
  schedule:
    # 全天每小时第 37 分钟启动，避开整点拥堵。
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndx5s-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read FEIXIA and validate
        id: fetch
        continue-on-error: true
        run: python scripts/update_qdii.py --force
      - name: Validate and build
        run: |
          python -m unittest discover -s tests
          python scripts/build_site.py
          python scripts/verify_publication.py
      - name: Preserve last successful snapshot and check status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/qdii.json data/qdii_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update QDII monitoring snapshot'
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate interactive pages
        run: |
          npm ci --no-audit --no-fund
          node tests/ui.test.cjs
          node tests/qdii-ui.test.cjs
      - name: Deploy NDX5S Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '939edb81f78bc31df2f9b60b6223a0fb'
        run: npx wrangler pages deploy dist --project-name ndx5s --branch main --skip-caching
      - name: Verify published JSON and cache headers
        run: python scripts/verify_publication.py --url https://ndx5s.pages.dev --attempts 6
      - name: Report unsuccessful data refresh
        if: steps.fetch.outcome == 'failure'
        run: exit 1

name: NDX5S daily close
on:
  schedule:
    - cron: '17 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ndx5s-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check NYSE close
        id: gate
        run: python scripts/update_daily.py --gate-only
      - name: Fetch and calculate with the original engine
        if: steps.gate.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ '${{ steps.gate.outputs.eligible }}' = 'true' ]; then
            python scripts/update_daily.py
          else
            python scripts/build_site.py
          fi
      - name: Validate
        if: steps.gate.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tests
      - name: Preserve EPS snapshots and last report
        if: steps.gate.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ndx_fwd_eps.csv data/spx_close.json
          git add -f reports/latest.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update NDX5S after market close'
            git push
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: '22'
          cache: npm
      - name: Install deploy tooling
        if: steps.gate.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci --no-audit --no-fund
      - name: Verify interactive UI
        if: steps.gate.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          node tests/ui.test.cjs
          node tests/qdii-ui.test.cjs
      - name: Deploy NDX5S Pages
        if: steps.gate.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '939edb81f78bc31df2f9b60b6223a0fb'
        run: npx wrangler pages deploy dist --project-name ndx5s --branch main
